<div
  class="user-card"
  [class.clickable]="clickable"
  [class.theme-dark]="theme === 'dark'"
  [class.theme-light]="theme === 'light'"
  (click)="onCardClick()">

  <div class="user-header">
    <div class="avatar">
      <img *ngIf="user?.avatar" [src]="user.avatar" [alt]="displayName">
      <div *ngIf="!user?.avatar" class="avatar-placeholder">
        {{ displayName.charAt(0).toUpperCase() }}
      </div>
    </div>

    <div class="user-info">
      <h4 class="user-name">{{ displayName }}</h4>
      <p *ngIf="showEmail && user?.email" class="user-email">{{ user.email }}</p>

      <div class="user-status">
        <span class="status-indicator" [style.background-color]="statusColor"></span>
        <span [class]="roleClass">{{ user?.role || 'guest' }}</span>
      </div>
    </div>
  </div>

  <div *ngIf="user?.tags?.length" class="tags">
    <span *ngFor="let tag of user.tags" class="tag">{{ tag }}</span>
  </div>

  <div *ngIf="user?.metadata" class="metadata">
    <small>ID: {{ user.id }} | Last seen: {{ formattedLastSeen }}</small>
  </div>
</div>
