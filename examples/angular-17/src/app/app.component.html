<div class="app-container">
  <header class="app-header">
    <h1>{{ title }}</h1>
    <p>Test Angular component detection with Claude DevTools</p>
  </header>

  <main class="main-content">
    <section class="counters-section">
      <h2>Counter Components</h2>
      <div class="components-grid">
        <!-- Basic Counter -->
        <app-counter
          [initialValue]="0"
          [step]="1"
          [label]="'Basic Counter'"
          (valueChanged)="onCounterChanged($event)">
        </app-counter>

        <!-- Step Counter -->
        <app-counter
          [initialValue]="10"
          [step]="5"
          [label]="'Step by 5'"
          (valueChanged)="onCounterChanged($event)">
        </app-counter>

        <!-- Negative Counter -->
        <app-counter
          [initialValue]="-5"
          [step]="100"
          [label]="'Negative Start'"
          (valueChanged)="onCounterChanged($event)">
        </app-counter>
      </div>

      <div class="counter-status">
        <p>Last counter value: <strong>{{ counterValue }}</strong></p>
      </div>
    </section>

    <section class="users-section">
      <h2>User Card Components</h2>
      <div class="components-grid">
        <!-- Loop through users with different props -->
        <app-user-card
          *ngFor="let user of users; let i = index"
          [user]="user"
          [showEmail]="i !== 1"
          [clickable]="user.role === 'admin'"
          [theme]="user.role === 'admin' ? 'dark' : 'light'">
        </app-user-card>

        <!-- Custom user card -->
        <app-user-card
          [user]="{
            id: 999,
            name: 'Test User',
            email: 'test@example.com',
            role: 'user',
            isActive: true,
            tags: ['testing', 'demo'],
            metadata: { lastSeen: 'Now', projects: 0 }
          }"
          [showEmail]="false"
          [clickable]="true"
          [theme]="'light'">
        </app-user-card>
      </div>
    </section>

    <section class="nested-section">
      <h2>Nested Components</h2>
      <div class="nested-container">
        <div class="nested-wrapper">
          <app-counter
            [initialValue]="100"
            [step]="10"
            [label]="'Nested Counter'"
            (valueChanged)="onCounterChanged($event)">
          </app-counter>

          <div class="deeply-nested">
            <div class="inner-wrapper">
              <app-user-card
                [user]="users[0]"
                [showEmail]="true"
                [clickable]="false"
                [theme]="'dark'">
              </app-user-card>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Angular {{ '17' }} • Claude DevTools Testing</p>
  </footer>
</div>

<router-outlet />
