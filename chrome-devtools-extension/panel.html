<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        overflow: hidden;
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e9ecef;
      }
      .logo {
        width: 28px;
        height: 28px;
        margin-right: 12px;
        background: linear-gradient(45deg, #ff6b35, #f7931e);
        border-radius: 6px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
      }
      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        height: calc(100vh - 100px);
        overflow: hidden;
      }
      .left-panel,
      .right-panel {
        background: white;
        border-radius: 8px;
        padding: 20px;
        border: 1px solid #e9ecef;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .section-title {
        font-size: 14px;
        font-weight: 600;
        color: #666;
        text-transform: uppercase;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
      }
      .button {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        margin-bottom: 12px;
        box-sizing: border-box;
      }
      .button:hover {
        background: #f5f5f5;
        border-color: #bbb;
      }
      .button.primary {
        background: #007aff;
        color: white;
        border-color: #007aff;
      }
      .button.primary:hover {
        background: #0056cc;
      }
      .button:disabled {
        background: #f5f5f5;
        color: #999;
        cursor: not-allowed;
      }
      .textarea {
        width: 100%;
        min-height: 120px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        margin-bottom: 12px;
        box-sizing: border-box;
        max-width: 100%;
      }
      .selected-info {
        background: #f8f9fa;
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        font-size: 13px;
        margin-bottom: 16px;
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .selected-info.hidden {
        display: none;
      }
      .component-info {
        margin: 6px 0;
      }
      .component-info .label {
        font-weight: 600;
        color: #495057;
        display: inline-block;
        width: 80px;
      }
      .component-info .value {
        color: #6c757d;
        font-family: "SF Mono", Monaco, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .status {
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 6px;
        margin-top: 12px;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .picking-indicator {
        background: #cff4fc;
        color: #055160;
        border: 1px solid #b6effb;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
        margin-bottom: 16px;
        display: none;
      }
      .picking-indicator.active {
        display: block;
      }
      .element-preview {
        overflow: hidden;
        margin-bottom: 16px;
      }
      .element-screenshot {
        width: 100%;
        max-height: 200px;
        object-fit: contain;
        background: #f8f9fa;
      }
      .code-block {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 4px;
        padding: 12px;
        font-family: "SF Mono", Monaco, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-y: auto;
        margin-top: 8px;
        flex: 1;
        min-height: 100px;
      }
      .settings {
        margin-bottom: 12px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 6px;
        border: 1px solid #e9ecef;
      }
      .settings-title {
        font-size: 12px;
        font-weight: 600;
        color: #495057;
        margin-bottom: 8px;
      }
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-item input[type="checkbox"] {
        margin: 0;
      }
      .checkbox-item label {
        font-size: 13px;
        color: #495057;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo"></div>
      <div class="title">Claude DevTools</div>
    </div>

    <div class="picking-indicator" id="pickingIndicator">
      🎯 Element picker active - click any element on the page to select it
    </div>

    <div class="main-content">
      <div class="left-panel">
        <div class="section-title">Element Selection</div>
        <button id="pickElement" class="button">Pick Element</button>

        <div id="selectedInfo" class="selected-info hidden">
          <div class="component-info">
            <span class="label">Component:</span>
            <span class="value" id="componentName">-</span>
          </div>
          <div class="component-info">
            <span class="label">File:</span>
            <span class="value" id="componentFile">-</span>
          </div>
          <div class="component-info">
            <span class="label">Element:</span>
            <span class="value" id="elementTag">-</span>
          </div>
          <div class="component-info">
            <span class="label">Framework:</span>
            <span class="value" id="framework">-</span>
          </div>

          <div
            class="element-preview"
            id="elementPreview"
            style="display: none"
          >
            <img
              id="elementScreenshot"
              class="element-screenshot"
              alt="Element screenshot"
            />
          </div>

          <details
            id="componentPropsDetails"
            style="margin-top: 12px; display: none"
          >
            <summary style="cursor: pointer; font-weight: 600; color: #495057">
              Component Props
            </summary>
            <div class="code-block" id="componentProps"></div>
          </details>

          <details style="margin-top: 12px">
            <summary style="cursor: pointer; font-weight: 600; color: #495057">
              HTML Structure
            </summary>
            <div class="code-block" id="elementHTML"></div>
          </details>

          <details style="margin-top: 12px">
            <summary style="cursor: pointer; font-weight: 600; color: #495057">
              Computed Styles
            </summary>
            <div class="code-block" id="elementStyles"></div>
          </details>
        </div>
      </div>

      <div class="right-panel">
        <div class="section-title">Send to Claude</div>
        <textarea
          id="promptText"
          class="textarea"
          placeholder="What do you want to ask Claude about this element?&#10;&#10;Example: 'Explain how this component works' or 'Help me refactor this code'"
        ></textarea>

        <div class="settings">
          <div class="settings-title">Include in Prompt</div>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="includeImage" checked />
              <label for="includeImage">Include Image</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="includeStyles" checked />
              <label for="includeStyles">Include Computed Styles</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="includeDom" checked />
              <label for="includeDom">Include DOM Structure</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="includeProps" checked />
              <label for="includeProps">Include Component Props</label>
            </div>
          </div>
        </div>

        <button id="sendToClaude" class="button primary" disabled>
          Send to Claude
        </button>

        <div id="status" class="status" style="display: none"></div>
      </div>
    </div>

    <script src="source-map.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
