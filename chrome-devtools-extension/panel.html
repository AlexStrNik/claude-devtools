<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      :root {
        --primary: #C15F3C;
        --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
      }

      /* Light theme (default) */
      :root {
        --bg-main: #F4F3EE;
        --bg-secondary: #2A2621;
        --text-primary: #2A2621;
        --text-secondary: #F4F3EE;
        --text-muted: rgba(42, 38, 33, 0.5);
        --border-color: rgba(42, 38, 33, 0.5);
        --success-color: #22c55e;
        --error-color: #ef4444;
      }

      /* Dark theme */
      :root[data-theme="dark"] {
        --bg-main: #2A2621;
        --bg-secondary: #F4F3EE;
        --text-primary: #F4F3EE;
        --text-secondary: #2A2621;
        --text-muted: rgba(244, 243, 238, 0.5);
        --border-color: rgba(244, 243, 238, 0.5);
        --success-color: #22c55e;
        --error-color: #ef4444;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--bg-main);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-color);
      }
      .header-icon {
        width: 16px;
        height: 16px;
        margin-right: 8px;
      }
      .header-title {
        font-weight: normal;
        margin-right: 4px;
      }
      .header-version {
        color: var(--text-muted);
        font-size: 10px;
        margin-left: 4px;
      }
      .connection-status {
        display: flex;
        align-items: center;
        margin-left: auto;
        font-size: 11px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 4px;
        background: var(--success-color);
      }
      .status-dot.disconnected {
        background: var(--error-color);
      }
      .status-dot.warning {
        background: #f59e0b;
      }
      .port-input {
        margin-left: 8px;
        background: transparent;
        border: 1px solid var(--border-color);
        padding: 2px 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-primary);
        width: 60px;
        border-radius: 2px;
      }

      /* Body */
      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0; /* Allow flex item to shrink below content size */
      }

      /* Pick Row */
      .pick-row {
        display: flex;
        align-items: center;
        padding: 8px 12px;
      }
      .pick-button {
        background: transparent;
        border: none;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-primary);
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pick-button:hover {
        color: var(--primary);
      }
      .pick-button:hover .pick-icon {
        color: var(--primary);
      }
      .pick-icon {
        font-size: 16px;
        color: var(--primary);
      }
      .pick-status {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted);
      }
      .pick-status.success {
        color: var(--success-color);
      }
      .pick-status.error {
        color: var(--error-color);
      }

      /* Details Container */
      .details-container {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        min-height: 0; /* Allow flex item to shrink below content size */
      }
      .details-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        align-items: flex-start;
      }
      .details-label {
        color: var(--text-primary);
        flex-shrink: 0;
        margin-right: 24px;
      }
      .details-value {
        color: var(--text-muted);
        text-align: left;
        word-break: break-word;
        min-width: 0;
        max-width: 300px;
        white-space: pre-wrap;
        font-family: var(--font-mono);
      }
      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-style: italic;
        height: 100%;
        text-align: center;
      }

      /* Chat Container */
      .chat-container {
        border-top: 1px solid var(--border-color);
        background: var(--bg-main);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 120px;
        padding: 8px 12px 24px 12px;
      }
      .chat-textarea {
        background: var(--bg-main);
        border: 1px solid var(--primary);
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-primary);
        resize: none;
        outline: none;
        height: 80px;
        border-radius: 2px;
        overflow-y: auto;
        margin-bottom: 8px;
        box-sizing: border-box;
        line-height: 1.4;
      }
      .chat-textarea::placeholder {
        color: var(--text-muted);
      }
      .chat-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-options {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .option-item {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 11px;
      }
      .option-icon {
        font-size: 12px;
        margin-right: 6px;
      }
      .option-item.enabled .option-icon {
        color: var(--primary);
      }
      .option-item.enabled {
        color: var(--primary);
      }
      .option-item:not(.enabled) {
        color: var(--text-muted);
      }
      .option-item:not(.enabled) .option-icon {
        color: var(--text-muted);
      }
      .send-button {
        background: var(--primary);
        border: none;
        padding: 4px 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--bg-main);
        cursor: pointer;
        border-radius: 2px;
      }
      .send-button:disabled {
        background: var(--text-muted);
        color: var(--bg-main);
        cursor: not-allowed;
      }

      /* Hidden elements */
      .hidden {
        display: none;
      }

      /* Status styles */
      .status {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 2px;
        z-index: 1000;
      }
      .status.success {
        background: var(--success-color);
        color: white;
      }
      .status.error {
        background: var(--error-color);
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <img src="claude.png" class="header-icon" alt="Claude" />
      <span class="header-title">Claude DevTools</span>
      <span class="header-version" id="extensionVersion"></span>
      <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="connectionStatus">connected</span>
        <input type="text" class="port-input" id="portInput" value="47923" />
      </div>
    </div>

    <!-- Body -->
    <div class="body">
      <!-- Pick Row -->
      <div class="pick-row">
        <button class="pick-button" id="pickElement">
          <i class="ph ph-cursor pick-icon"></i>
          Pick Element
        </button>
        <span class="pick-status" id="pickStatus" style="display: none;"></span>
      </div>

      <!-- Details Container -->
      <div class="details-container" id="detailsContainer">
        <div class="hint">Select an element to inspect</div>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
      <textarea
        class="chat-textarea"
        id="promptText"
        placeholder="Ask Claude about the selected element..."
      ></textarea>
      <div class="chat-controls">
        <div class="chat-options">
          <div class="option-item enabled" id="screenshotOption">
            <i class="ph ph-camera option-icon"></i>
            <span>Screenshot</span>
          </div>
          <div class="option-item enabled" id="stylesOption">
            <i class="ph ph-palette option-icon"></i>
            <span>Styles</span>
          </div>
          <div class="option-item enabled" id="domOption">
            <i class="ph ph-code option-icon"></i>
            <span>DOM</span>
          </div>
          <div class="option-item enabled" id="propsOption">
            <i class="ph ph-list-bullets option-icon"></i>
            <span>Props</span>
          </div>
        </div>
        <button class="send-button" id="sendToClaude" disabled>Send</button>
      </div>
    </div>

    <script src="source-map.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
